---

name: Publish a release image

# Reusable workflow for the release workflows of belfry, belfry-ee and
# belfry-operator. The caller builds one image per architecture and passes the
# references; this workflow then:
#
# - publishes them as one multi-arch image, tagged :<version> (and :latest for
#   final releases), or only :release-test in a dry run;
# - attests build provenance and an SBOM (SPDX) to the image;
# - scans the image with Trivy;
# - attaches the SBOM and the scan to the GitHub release and adds the scan
#   summary to the release notes (in a dry run: uploads them as workflow
#   artifacts instead).
#
# See RELEASING.md in belfry-project/.github for the whole procedure.

on:
  workflow_call:
    inputs:
      image:
        description: 'Image name without tag, e.g. ghcr.io/belfry-project/belfry'
        type: string
        required: true
      version:
        description: 'Release version (X.Y.Z or X.Y.Z-rc.N); also the release tag'
        type: string
        required: true
      sources:
        description: 'Space-separated per-architecture image references to merge'
        type: string
        required: true
      dry_run:
        description: 'Only publish :release-test and do not touch the GitHub release'
        type: boolean
        default: true
    outputs:
      digest:
        description: 'Digest of the multi-arch image'
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: 'The tag the image was published as (version, or release-test in a dry run)'
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  publish:
    name: Publish ${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      tag: ${{ steps.tags.outputs.tag }}
    env:
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Version ${VERSION} is not X.Y.Z or X.Y.Z-rc.N"
            exit 1
          fi

      - name: Determine tags
        id: tags
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            tag=release-test
            tags="--tag ${IMAGE}:release-test"
          else
            tag="${VERSION}"
            tags="--tag ${IMAGE}:${VERSION}"
            # :latest is the newest final release; release candidates never get it
            if [[ "${VERSION}" != *-* ]]; then
              tags="${tags} --tag ${IMAGE}:latest"
            fi
          fi
          name="${IMAGE##*/}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "files=${name}-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${IMAGE} with: ${tags}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch image
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.tags }} \
            --annotation="index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation="index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation="index:org.opencontainers.image.version=${VERSION}" \
            ${{ inputs.sources }}
          docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}"

      - name: Check that both architectures are present
        run: |
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[] | select(.platform.os != "unknown") | .platform.os + "/" + .platform.architecture] | sort | join(" ")')
          echo "Platforms: ${platforms}"
          if [ "${platforms}" != "linux/amd64 linux/arm64" ]; then
            echo "::error::Expected linux/amd64 and linux/arm64, got: ${platforms}"
            exit 1
          fi

      - name: Get the image digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${{ steps.tags.outputs.tag }}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}@${digest}"

      # Signed statement of which repository, commit and workflow built the image.
      # Verify with: gh attestation verify oci://<image>:<version> --owner belfry-project
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: ${{ steps.tags.outputs.files }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: ${{ steps.tags.outputs.files }}.spdx.json
          push-to-registry: true

      - name: Install Trivy
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
          trivy --version

      - name: Scan the image with Trivy
        env:
          FILES: ${{ steps.tags.outputs.files }}
          REF: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
        run: |
          trivy image --quiet --scanners vuln --platform linux/amd64 --format json --output "${FILES}-trivy.json" "${REF}"
          trivy version --format json > trivy-version.json
          python3 - "${FILES}-trivy.json" trivy-version.json "${FILES}-trivy.md" <<'EOF'
          import json, os, sys

          report_path, version_path, summary_path = sys.argv[1:4]
          report = json.load(open(report_path))
          trivy = json.load(open(version_path))
          severities = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']
          counts = {s: 0 for s in severities}
          fixable = {s: 0 for s in severities}
          seen = set()
          # Count each CVE once per package, like the comparison page does
          for target in report.get('Results') or []:
              for vuln in target.get('Vulnerabilities') or []:
                  key = (vuln['VulnerabilityID'], vuln['PkgName'], vuln.get('InstalledVersion'))
                  if key in seen or vuln.get('Severity') not in counts:
                      continue
                  seen.add(key)
                  counts[vuln['Severity']] += 1
                  if vuln.get('FixedVersion'):
                      fixable[vuln['Severity']] += 1
          image = os.environ['REF']
          lines = [
              f"Known vulnerabilities in `{image}` (linux/amd64) found by Trivy {trivy.get('Version')}, "
              f"vulnerability database of {(trivy.get('VulnerabilityDB') or {}).get('UpdatedAt', '')[:10]}:",
              '',
              '| Severity | Count | With a fix available |',
              '| --- | ---: | ---: |',
          ]
          lines += [f'| {s.title()} | {counts[s]} | {fixable[s]} |' for s in severities]
          lines += ['', f"Critical: {counts['CRITICAL']}, high: {counts['HIGH']}."]
          open(summary_path, 'w').write('\n'.join(lines) + '\n')
          print('\n'.join(lines))
          EOF
          cat "${FILES}-trivy.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the evidence as workflow artifacts (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tags.outputs.name }}-release-evidence
          path: |
            ${{ steps.tags.outputs.files }}.spdx.json
            ${{ steps.tags.outputs.files }}-trivy.json
            ${{ steps.tags.outputs.files }}-trivy.md

      - name: Attach the evidence to the GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILES: ${{ steps.tags.outputs.files }}
          NAME: ${{ steps.tags.outputs.name }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          gh release upload "${VERSION}" --clobber \
            "${FILES}.spdx.json" "${FILES}-trivy.json" "${FILES}-trivy.md"
          # Add (or replace, on a rerun) a section with the image and the scan summary in the release notes
          gh release view "${VERSION}" --json body --jq .body > body.md
          {
            echo "<!-- belfry-release:${NAME} -->"
            echo "## Image \`${NAME}\`"
            echo
            echo "\`${IMAGE}:${VERSION}\` (\`${DIGEST}\`), for linux/amd64 and linux/arm64."
            echo
            echo "Verify with \`gh attestation verify oci://${IMAGE}:${VERSION} --owner ${{ github.repository_owner }}\`."
            echo "The SBOM (\`${FILES}.spdx.json\`) and the full scan (\`${FILES}-trivy.json\`) are attached below."
            echo
            cat "${FILES}-trivy.md"
            echo "<!-- /belfry-release:${NAME} -->"
          } > section.md
          python3 - body.md section.md "${NAME}" <<'EOF'
          import re, sys

          body_path, section_path, name = sys.argv[1:4]
          body = open(body_path).read().rstrip('\n')
          section = open(section_path).read().rstrip('\n')
          pattern = re.compile(rf'<!-- belfry-release:{re.escape(name)} -->.*?<!-- /belfry-release:{re.escape(name)} -->', re.S)
          if pattern.search(body):
              body = pattern.sub(lambda _: section, body)
          else:
              body = f'{body}\n\n{section}' if body else section
          open(body_path, 'w').write(body + '\n')
          EOF
          gh release edit "${VERSION}" --notes-file body.md
