---

name: Check for upstream changes

# Reusable workflow for the weekly upstream check of the Belfry repositories.
# It lists the upstream commits that are not yet merged into the caller's main
# branch (and, optionally, new commits of dependencies pinned by git commit) and
# keeps one tracking issue labelled "upstream-sync" in the caller's repository
# up to date: it opens or updates the issue while there is something new and
# closes it once everything is merged.
#
# It only reads the upstream repositories: it never pushes, merges or opens
# anything outside the caller's repository. Merging is done by hand, see
# SYNCING.md in belfry-project/.github.
#
# The caller needs: permissions: contents: read, issues: write.

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: 'Upstream repository, e.g. ansible/awx'
        type: string
        required: true
      upstream_branch:
        description: 'Upstream branch that Belfry follows, e.g. devel'
        type: string
        required: true
      branch:
        description: "The caller's branch that upstream is merged into"
        type: string
        default: main
      pinned_repos:
        description: >-
          Optional dependencies pinned by git commit, one per line:
          "<owner/repo> <branch> <file>". The pinned commit is the first
          github.com/<owner/repo>@<sha> in <file> on the caller's branch.
        type: string
        default: ''
      note:
        description: 'Optional extra text for the tracking issue'
        type: string
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM_REPO: ${{ inputs.upstream_repo }}
      UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
      BRANCH: ${{ inputs.branch }}
      PINNED_REPOS: ${{ inputs.pinned_repos }}
      NOTE: ${{ inputs.note }}
      LABEL: upstream-sync
      MAX_LISTED: '150'
    steps:
      - name: Fetch the history of both branches (commits only)
        run: |
          git init -q repo
          cd repo
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git remote set-url --push upstream DISABLED
          git fetch -q --no-tags --filter=tree:0 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git fetch -q --no-tags --filter=tree:0 upstream "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"

      - name: Write the report
        id: report
        run: |
          cd repo
          ours="origin/${BRANCH}"
          theirs="upstream/${UPSTREAM_BRANCH}"
          head=$(git rev-parse "${theirs}")
          if ! base=$(git merge-base "${ours}" "${theirs}"); then
            echo "::error::${BRANCH} and ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} have no common history"
            exit 1
          fi
          count=$(git rev-list --count "${base}..${theirs}")
          total=${count}
          report="${RUNNER_TEMP}/report.md"
          {
            echo "<!-- upstream-check: generated by the weekly upstream check, the body is replaced on every run -->"
            echo "Weekly check of [\`${UPSTREAM_REPO}\`](https://github.com/${UPSTREAM_REPO}) \`${UPSTREAM_BRANCH}\` against \`${BRANCH}\` (last run: $(date -u +%Y-%m-%d))."
            echo
            echo "Last upstream commit merged into \`${BRANCH}\`: \`${base:0:10}\`. Upstream head: \`${head:0:10}\`."
            echo
            if [ "${count}" -eq 0 ]; then
              echo "No new upstream commits."
            else
              echo "**${count} new upstream commit(s)**: [compare](https://github.com/${UPSTREAM_REPO}/compare/${base}...${head})"
              echo
              # A fenced block, so that issue numbers and @-mentions in commit
              # subjects do not link to (or notify) anything
              echo '```text'
              git log --format='%h %as %an: %s' -n "${MAX_LISTED}" "${base}..${theirs}" | sed 's/```/'"'''"'/g'
              if [ "${count}" -gt "${MAX_LISTED}" ]; then
                echo "... and $((count - MAX_LISTED)) more"
              fi
              echo '```'
            fi
          } > "${report}"

          while read -r repo dep_branch file; do
            [ -n "${repo}" ] || continue
            pinned=$(git show "${ours}:${file}" 2>/dev/null | grep -oE "github\.com/${repo}@[0-9a-f]{7,40}" | head -n1 | cut -d@ -f2 || true)
            {
              echo
              echo "### \`${repo}\` (pinned in \`${file}\`)"
              echo
            } >> "${report}"
            if [ -z "${pinned}" ]; then
              echo "::warning::no github.com/${repo}@<sha> pin found in ${file}"
              echo "No \`github.com/${repo}@<sha>\` pin found in \`${file}\`." >> "${report}"
              continue
            fi
            compare=$(gh api "repos/${repo}/compare/${pinned}...${dep_branch}")
            ahead=$(jq -r .ahead_by <<< "${compare}")
            total=$((total + ahead))
            if [ "${ahead}" -eq 0 ]; then
              echo "Pinned commit \`${pinned:0:10}\` is the head of \`${dep_branch}\`." >> "${report}"
            else
              {
                echo "**${ahead} new commit(s)** on \`${dep_branch}\` since the pinned \`${pinned:0:10}\`: [compare](https://github.com/${repo}/compare/${pinned}...${dep_branch}). Check them for breaking changes before bumping the pin."
                echo
                echo '```text'
                jq -r '.commits | reverse | .[] | "\(.sha[0:9]) \(.commit.author.date[0:10]) \(.commit.author.name): \(.commit.message | split("\n")[0])"' <<< "${compare}" | head -n "${MAX_LISTED}" | sed 's/```/'"'''"'/g'
                echo '```'
              } >> "${report}"
            fi
          done <<< "${PINNED_REPOS}"

          {
            echo
            if [ -n "${NOTE}" ]; then
              echo "${NOTE}"
              echo
            fi
            echo "To merge, follow [SYNCING.md](https://github.com/belfry-project/.github/blob/main/SYNCING.md). This issue is closed automatically when nothing is left."
          } >> "${report}"

          cat "${report}" >> "${GITHUB_STEP_SUMMARY}"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"
          echo "total=${total}" >> "${GITHUB_OUTPUT}"
          echo "head=${head:0:10}" >> "${GITHUB_OUTPUT}"
          echo "report=${report}" >> "${GITHUB_OUTPUT}"

      - name: Update the tracking issue
        env:
          TOTAL: ${{ steps.report.outputs.total }}
          COUNT: ${{ steps.report.outputs.count }}
          HEAD: ${{ steps.report.outputs.head }}
          REPORT: ${{ steps.report.outputs.report }}
        run: |
          issue=$(gh issue list --label "${LABEL}" --state open --json number --jq '.[0].number // empty')
          if [ "${TOTAL}" -eq 0 ]; then
            if [ -n "${issue}" ]; then
              gh issue close "${issue}" --comment "Everything from \`${UPSTREAM_REPO}\` \`${UPSTREAM_BRANCH}\` (up to \`${HEAD}\`) is merged. Closing."
            fi
            echo "Nothing new upstream."
            exit 0
          fi
          if [ "${COUNT}" -eq 0 ]; then
            title="Upstream sync: new commits in pinned dependencies"
          elif [ "${TOTAL}" != "${COUNT}" ]; then
            title="Upstream sync: ${COUNT} new commit(s) in ${UPSTREAM_REPO} and pinned dependencies"
          else
            title="Upstream sync: ${COUNT} new commit(s) in ${UPSTREAM_REPO}"
          fi
          if [ -z "${issue}" ]; then
            gh label create "${LABEL}" --color 0e8a16 --description "Changes from upstream to merge" 2>/dev/null || true
            gh issue create --title "${title}" --label "${LABEL}" --body-file "${REPORT}"
          else
            old=$(gh issue view "${issue}" --json body --jq .body)
            gh issue edit "${issue}" --title "${title}" --body-file "${REPORT}"
            # Comment (and so notify) only when the list changed
            if [ "$(grep -v '(last run:' <<< "${old}")" != "$(grep -v '(last run:' "${REPORT}")" ]; then
              gh issue comment "${issue}" --body "The list changed (upstream head \`${HEAD}\`, ${TOTAL} commit(s) in total); the description is updated."
            fi
          fi
